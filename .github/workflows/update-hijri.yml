name: Update Hijri Date

permissions:
  contents: write

on:
  schedule:
    # Every 2 hours. The fetch is a single HTTPS request and commits only when
    # the data actually changes, so a new month is picked up within 2 hours of
    # ACJU publishing it instead of waiting for the next nightly run.
    - cron: '0 */2 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Colombo  # Set the timezone for the entire job
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No `npm install` — the fetch script has no dependencies.
      #
      # continue-on-error so a degraded run still reaches the commit step: when
      # ACJU cannot be read at a month boundary the script writes provisional
      # dates and exits non-zero, and those dates are worth publishing. The
      # "Report fetch status" step below turns that into a red job afterwards.
      - name: Fetch Hijri month calendar
        id: fetch
        continue-on-error: true
        run: npm run fetch-month

      # Only written when the page was reachable but unparseable — the case that
      # is impossible to reproduce locally, since acju.lk serves runners
      # differently than a browser in Sri Lanka.
      - name: Upload unparseable ACJU response
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acju-debug-html
          path: acju-debug.html
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit and push
        env:
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add api/hijri-month.json
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update Hijri month calendar - $(TZ=Asia/Colombo date)"

          # Pull any remote changes first, then push
          git pull --rebase origin main || true

          # Try push with the default token first (persisted credentials). If it fails and a REPO_TOKEN
          # is provided, retry using that token.
          if git push; then
            echo "Pushed with GITHUB_TOKEN"
          else
            if [ -n "$REPO_TOKEN" ]; then
              echo "Push failed with GITHUB_TOKEN, retrying with provided REPO_TOKEN"
              git remote set-url origin https://x-access-token:${REPO_TOKEN}@github.com/${{ github.repository }}.git
              git push
            else
              echo "Push failed and no REPO_TOKEN provided. See repository Actions settings and branch protection rules." >&2
              exit 1
            fi
          fi

      # The stored month covers ~29 days, so a failed read only matters at a
      # month boundary — the script exits 0 while the data on disk is still
      # valid. Reaching here with a failure means it is not.
      - name: Report fetch status
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::error::Could not read the Hijri month from ACJU and the stored data no longer covers today." >&2
          exit 1
