<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hijri Calendar</title>
    <style>
        :root {
            --bg: #f5f5f5;
            --surface: #ffffff;
            --text: #263238;
            --muted: #7f8c8d;
            --primary: rgb(126,255,116); /* green */
            --secondary: rgb(253,227,0); /* yellow */
            --error: #FC7878;
            --card-bg: #ffffff;
            --card-text: #2c3e50;
        }

        .dark {
            --bg: #0b0b0b;
            --surface: #000000;
            --text: #ffffff;
            --muted: #b0b6b8;
            --primary: rgb(126,255,116);
            --secondary: rgb(253,227,0);
            --error: #FC7878;
            --card-bg: #121212;
            --card-text: #ffffff;
        }

        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            background-color: var(--bg);
            color: var(--text);
        }
        .calendar {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.08);
            text-align: center;
            color: var(--card-text);
        }
        .controls { display:flex; justify-content:flex-end; gap:8px; align-items:center; }
        .theme-toggle {
            background: transparent;
            border: 1px solid rgba(0,0,0,0.06);
            padding:6px 8px;
            border-radius:8px;
            cursor:pointer;
            color:var(--card-text);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width:40px;
            height:36px;
        }
        .theme-toggle #theme-icon { display:inline-flex; font-size:18px; line-height:1; }
        .hijri-date {
            font-size: 2em;
            color: var(--card-text);
            margin: 14px 0;
        }
        .gregorian-date {
            font-size: 1.05em;
            color: var(--muted);
        }
        .loading { display: none; }
        .error { color: var(--error); display: none; }

        /* Month view styles */
        .month { margin-top: 18px; text-align: left; }
        .month h2 { margin: 0 0 8px 0; font-size: 1.05em; color: var(--card-text); }
        .month-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-top: 10px; }
        .weekday-row { display: contents; }
        .weekday { font-size: 0.78em; color: var(--muted); text-align: center; padding: 6px 4px; }
        .day { background: rgba(255,255,255,0.03); padding: 10px 6px; border-radius: 8px; text-align: center; font-size: 0.95em; border: 1px solid rgba(0,0,0,0.04); }
        .day.empty { background: transparent; border-color: transparent; }
        .hijri-day { font-weight: 700; font-size: 1.05em; color: var(--card-text); }
        .gregorian { font-size: 0.82em; color: var(--muted); margin-top: 4px; }
        .day.today { background: var(--primary); color: #022; box-shadow: 0 6px 14px rgba(0,0,0,0.12); transform: translateY(-2px); }
        .day.today .hijri-day { color: rgba(0,0,0,0.9); font-weight:800; }
        .day.today .gregorian { color: rgba(0,0,0,0.85); font-weight:700; font-size:0.9em; }
        .note { margin-top: 10px; font-size: 0.85em; color: var(--muted); }

        /* Stay at 7 columns on every width — the weekday header only lines up
           with the day cells in a 7-column grid. */
        @media (max-width: 720px) {
            .month-grid { gap: 5px; }
            .day { padding: 8px 2px; font-size: 0.85em; }
            .weekday { font-size: 0.7em; padding: 4px 2px; }
        }
        @media (max-width: 420px) {
            .month-grid { gap: 3px; }
            .day { padding: 6px 1px; font-size: 0.75em; }
            .gregorian { font-size: 0.68em; margin-top: 2px; }
        }
    </style>
</head>
<body>
    <div class="calendar">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;">
            <h1 style="margin:0">Hijri Calendar</h1>
            <div class="controls">
                <button id="theme-toggle" class="theme-toggle" aria-pressed="false" aria-label="Toggle theme">
                    <span id="theme-icon" aria-hidden="true">🌙</span>
                </button>
            </div>
        </div>
        <div id="loading" class="loading">Loading...</div>
        <div id="error" class="error">Error loading date</div>
        <div id="hijri-date" class="hijri-date"></div>
        <div id="gregorian-date" class="gregorian-date"></div>

        <!-- Month view -->
        <div id="month" class="month">
            <h2 id="month-title"></h2>
            <div id="month-grid" class="month-grid" aria-live="polite"></div>
            <div id="note" class="note"></div>
        </div>
    </div>

    <!-- Simple last-updated shown outside the card -->
    <p id="last-updated-simple" style="text-align:center;margin-top:12px;color:var(--muted);font-size:0.95em;">Last updated: <span id="last-updated"></span></p>

    <script>
        // ── Hijri month names (as acju.lk spells them) ────────────────────────
        const HIJRI_MONTHS = [
            "Muharram", "Safar", "Rabi' al-Awwal", "Rabi' al-Thani",
            "Jumada al-Awwal", "Jumada al-Thani", "Rajab", "Sha'ban",
            "Ramadan", "Shawwal", "Dhu al-Qi'dah", "Dhu al-Hijjah"
        ];

        const GREGORIAN_MONTHS = ['January','February','March','April','May','June',
                                  'July','August','September','October','November','December'];
        const WEEKDAY_NAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

        function nextHijriMonth(month, year) {
            const i = HIJRI_MONTHS.indexOf(month);
            if (i === -1) return { month: month, year: year };  // unknown name — leave as is
            const next = (i + 1) % 12;
            return {
                month: HIJRI_MONTHS[next],
                year:  next === 0 ? String(parseInt(year) + 1) : year
            };
        }

        function getSLNow() {
            return new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Colombo' }));
        }

        // Matches the `gregorianDate` strings stored in the JSON
        function gregorianKey(date) {
            return `${GREGORIAN_MONTHS[date.getMonth()]} ${date.getDate()}, ${date.getFullYear()}`;
        }

        function longDate(date) {
            return `${WEEKDAY_NAMES[date.getDay()]}, ${gregorianKey(date)}`;
        }

        // Fetch today's Maghrib time for Colombo from aladhan.com
        async function getMaghribSL() {
            try {
                const res = await fetch(
                    'https://api.aladhan.com/v1/timingsByCity?city=Colombo&country=Sri+Lanka&method=1',
                    { cache: 'force-cache' }
                );
                const json = await res.json();
                return json.data?.timings?.Maghrib || '18:10';
            } catch (e) {
                console.warn('Could not fetch Maghrib time, using fallback 18:10');
                return '18:10';
            }
        }

        function isPastMaghrib(maghribStr) {
            const [h, m] = maghribStr.split(':').map(Number);
            const sl = getSLNow();
            return (sl.getHours() * 60 + sl.getMinutes()) >= (h * 60 + m);
        }

        async function fetchJSON(bustCache = false) {
            const url = bustCache
                ? `./api/hijri-month.json?v=${Date.now()}`
                : './api/hijri-month.json';
            const res = await fetch(url);
            if (!res.ok) throw new Error('Failed to fetch');
            return res.json();
        }

        async function loadCalendar() {
            const loading      = document.getElementById('loading');
            const errorEl      = document.getElementById('error');
            const hijriDateEl  = document.getElementById('hijri-date');
            const gregDateEl   = document.getElementById('gregorian-date');
            const lastUpdated  = document.getElementById('last-updated');
            const grid         = document.getElementById('month-grid');
            const title        = document.getElementById('month-title');
            const noteEl       = document.getElementById('note');

            loading.style.display = 'block';
            errorEl.style.display = 'none';
            noteEl.textContent    = '';

            try {
                const today    = getSLNow();
                const todayKey = gregorianKey(today);

                let data  = await fetchJSON();
                // Locate today by its Gregorian date. `currentHijriDay` is frozen
                // at fetch time and goes stale the moment the day rolls over.
                let entry = data.dates.find(d => d.gregorianDate === todayKey);

                // Stored month does not cover today — the Action may have just
                // published the new one, so retry past the CDN cache.
                if (!entry) {
                    try {
                        const fresh = await fetchJSON(true);
                        const freshEntry = fresh.dates.find(d => d.gregorianDate === todayKey);
                        if (freshEntry) { data = fresh; entry = freshEntry; }
                    } catch (e) { /* keep what we already have */ }
                }

                lastUpdated.textContent = new Date(data.fetchedAt).toLocaleString();

                // ── Which Hijri day is it right now? ──────────────────────────
                // The Hijri day turns over at sunset, not at midnight.
                let displayDay      = entry ? entry.hijriDay : null;
                let displayMonth    = data.hijriMonth;
                let displayYear     = data.hijriYear;
                let newMonthPending = false;
                let afterMaghrib    = false;

                if (entry) {
                    afterMaghrib = isPastMaghrib(await getMaghribSL());
                    if (afterMaghrib) {
                        if (entry.hijriDay < data.totalDays) {
                            displayDay = entry.hijriDay + 1;
                        } else {
                            // Sunset on the last day — works for 29- and 30-day
                            // months alike, since totalDays comes from ACJU.
                            const next = nextHijriMonth(data.hijriMonth, data.hijriYear);
                            displayMonth    = next.month;
                            displayYear     = next.year;
                            displayDay      = 1;
                            newMonthPending = true;
                        }
                    }
                }

                loading.style.display = 'none';

                // ── New month begun, calendar not published yet ───────────────
                if (newMonthPending) {
                    hijriDateEl.textContent = `1 ${displayMonth}`;
                    gregDateEl.textContent  = longDate(today);
                    title.textContent       = `${displayMonth} ${displayYear}`;
                    grid.innerHTML = `
                        <div style="grid-column:1/-1;text-align:center;padding:28px 12px;">
                            <div style="font-size:2em;margin-bottom:8px;">🌙</div>
                            <div style="font-weight:700;font-size:1.1em;color:var(--primary);margin-bottom:6px;">
                                New Hijri month has begun
                            </div>
                            <div style="color:var(--muted);font-size:0.92em;">
                                ${displayMonth} ${displayYear} calendar will be available shortly
                            </div>
                        </div>`;
                    return;
                }

                // ── Normal render ─────────────────────────────────────────────
                hijriDateEl.textContent = displayDay ? `${displayDay} ${displayMonth}` : '—';
                gregDateEl.textContent  = displayDay
                    ? longDate(today)
                    : 'Waiting for this month\'s calendar to be published';

                title.textContent = `${data.hijriMonth} ${data.hijriYear}`;
                grid.innerHTML = '';

                const weekdays = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
                const headerRow = document.createElement('div');
                headerRow.className = 'weekday-row';
                weekdays.forEach(w => {
                    const el = document.createElement('div');
                    el.className = 'weekday';
                    el.textContent = w;
                    headerRow.appendChild(el);
                });
                grid.appendChild(headerRow);

                // Pad so day 1 lands under its actual weekday column
                const first = data.dates[0];
                const firstDate = new Date(first.gregorianYear,
                                           GREGORIAN_MONTHS.indexOf(first.gregorianMonth),
                                           first.gregorianDay);
                for (let i = 0; i < firstDate.getDay(); i++) {
                    const blank = document.createElement('div');
                    blank.className = 'day empty';
                    grid.appendChild(blank);
                }

                data.dates.forEach(d => {
                    const day = document.createElement('div');
                    day.className = 'day';
                    if (d.hijriDay === displayDay) day.classList.add('today');
                    day.title = d.gregorianDate;
                    day.innerHTML = `<div class="hijri-day">${d.hijriDay}</div><div class="gregorian">${d.gregorianMonth} ${d.gregorianDay}</div>`;
                    grid.appendChild(day);
                });

                const notes = [];
                if (afterMaghrib) notes.push('Date has moved on — the Hijri day begins at Maghrib.');
                if (data.provisional) notes.push('Provisional dates — awaiting confirmation from ACJU.');
                noteEl.textContent = notes.join(' ');

            } catch (err) {
                console.error('Error:', err);
                loading.style.display = 'none';
                errorEl.style.display = 'block';
                errorEl.textContent   = 'Error loading date. Please try again later.';
            }
        }

        // Load on page load
        loadCalendar();

        // Refresh every 30 minutes (catches Maghrib crossing without full reload)
        setInterval(loadCalendar, 30 * 60 * 1000);

        // Theme handling
        function applyTheme(name) {
            if (name === 'dark') {
                document.documentElement.classList.add('dark');
                document.getElementById('theme-toggle').setAttribute('aria-pressed', 'true');
                const icon = document.getElementById('theme-icon');
                if (icon) icon.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" fill="currentColor"/></svg>';
                document.getElementById('theme-toggle').setAttribute('aria-label', 'Switch to light theme');
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('theme-toggle').setAttribute('aria-pressed', 'false');
                const icon = document.getElementById('theme-icon');
                if (icon) icon.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6.76 4.84l-1.8-1.79L3.17 4.84l1.79 1.8 1.8-1.8zM1 13h3v-2H1v2zm10 9h2v-3h-2v3zM17.24 19.16l1.8 1.79 1.79-1.79-1.79-1.8-1.8 1.8zM20 11v2h3v-2h-3zM12 4a8 8 0 100 16 8 8 0 000-16z" fill="currentColor"/></svg>';
                document.getElementById('theme-toggle').setAttribute('aria-label', 'Switch to dark theme');
            }
        }

        function initTheme() {
            const btn = document.getElementById('theme-toggle');
            const stored = localStorage.getItem('hijri-theme');
            if (stored) {
                applyTheme(stored);
            } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                applyTheme('dark');
            } else {
                applyTheme('light');
            }

            btn.addEventListener('click', () => {
                const isDark = document.documentElement.classList.contains('dark');
                const next = isDark ? 'light' : 'dark';
                applyTheme(next);
                localStorage.setItem('hijri-theme', next);
            });
        }

        initTheme();
    </script>
</body>
</html>
